# Netlify configuration for the static frontend.
# The Node/Express API remains on Bothost.
[build]
  publish = "public"

# Keep /api calls same-origin in the browser while forwarding them to Bothost.
[[redirects]]
  from = "/api/*"
  to = "https://bot-1791109324-4239-skyred123.bothost.tech/api/:splat"
  status = 200
  force = true

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Topoff Ranked</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2c;--line:#262b3d;--tx:#e8ebf5;--mu:#7d86a3;--ac:#ff5a1f;--ac2:#18e0c8;--ok:#2fd67b;--bad:#ff4560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(var(--bg),#0a0c12ee);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:1px;font-size:18px}.logo b{color:var(--ac)}.logo i{font-style:normal;color:var(--ac2);font-size:11px;margin-left:6px;border:1px solid var(--ac2);padding:1px 5px;border-radius:4px}
.back{background:var(--bg3);border:0;color:var(--tx);border-radius:10px;width:34px;height:34px;font-size:18px}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:#0d1019f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}

.br{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:stretch}.bcol{min-width:172px;display:flex;flex-direction:column}.bh{text-align:center;font-size:12px;font-weight:700;margin-bottom:8px}.bh span{display:block;color:var(--ac2);font-size:11px}.bc{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}.bm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}.bm.click{border-color:var(--ac)}.bt{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;font-size:13px;border-top:1px solid var(--line)}.bt:first-child{border:0}.bt.w{background:#2fd67b1f;font-weight:800}.bt.n{color:var(--mu)}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:85%;overflow:auto}
.demo{font-size:11px;color:var(--mu);background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:8px;margin-top:18px}.demo select{margin:6px 0 0;padding:8px}
label{font-size:12px;color:var(--mu);display:block;margin:2px 0 4px}
.tb.mt td:nth-child(2){text-align:center;font-weight:400}
.tag.reserve{background:#ffffff14;color:#c4cde0}
.ava.huge{width:84px;height:84px;font-size:38px;border-radius:20px}
.sc{border-radius:10px;padding:10px;text-align:center}.sc b{display:block;font-size:20px}.sc span{font-size:11px;opacity:.85;text-transform:uppercase}.cg{background:#1f7a45}.cy{background:#8a8530}.cr{background:#8b3340}.cn{background:var(--bg3)}
.shot{width:100%;border-radius:10px;margin-top:8px;display:block;cursor:zoom-in}
</style></head><body>
<header id="hd"></header><main id="app"></main><nav id="nav"></nav><div id="sh"></div>
<script src="/config.js"></script>
<script>
let tg=(window.Telegram&&Telegram.WebApp)||null;
if(!tg||!tg.initData){try{const hd=new URLSearchParams((location.hash||'').slice(1)).get('tgWebAppData');if(hd){let us=null;try{us=JSON.parse(new URLSearchParams(hd).get('user'))}catch(_){}tg=Object.assign(tg||{},{initData:hd,initDataUnsafe:Object.assign({},tg&&tg.initDataUnsafe,{user:us}),ready(){},expand(){}})}}catch(_){}}
try{if(!(window.Telegram&&Telegram.WebApp)){const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';sc.async=true;sc.onload=()=>{try{const w=window.Telegram.WebApp;w.ready();w.expand();w.setHeaderColor('#0a0c12');w.setBackgroundColor('#0a0c12')}catch(e){}};document.head.appendChild(sc)}}catch(e){}
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0a0c12');tg.setBackgroundColor('#0a0c12')}catch(e){}}
let uid=100;const nid=()=>'x'+(uid++);
const S={
teams:[],players:[],matches:[],etab:'over',rq:'',invites:[],events:[],praks:[],route:{p:'home'},pf:'all',tf:'all',hist:[],me:null,admin:true,q:'',tab:'invite',atab:'players'};
const API_BASE=String(window.STANDRISE_API_BASE||'/api').replace(/\/$/,'');
let apiReady=false;
async function apiJson(url,options={}){const r=await fetch(API_BASE+url,{headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg&&tg.initData?tg.initData:''},...options});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Ошибка сервера');return d}
const save=()=>{try{S.events.forEach(autoDq)}catch(e){console.warn('autoDq:',e)}if(!apiReady)return;const payload={teams:S.teams,players:S.players,matches:S.matches,invites:S.invites,events:S.events,praks:S.praks};apiJson('/state',{method:'PUT',body:JSON.stringify(payload)}).catch(e=>console.warn('StandRise sync:',e.message));};
async function bootstrapOnline(){
  try{
    const d=await apiJson('/bootstrap');
    apiReady=true;
    ['teams','players','matches','invites','events','praks'].forEach(k=>{if(Array.isArray(d.state?.[k]))S[k]=d.state[k]});
    if(d.user){
      const p=S.players.find(x=>String(x.tg)===String(d.user.telegramId)||String(x.id)===String(d.user.playerId));
      if(p)S.me=p.id;
      S.real=true;S.admin=false;S.reg=!p;
      if(!p)S.pending={tg:String(d.user.telegramId),nick:d.user.username||d.user.firstName||''};
    }
    if(d.state?.nextId)uid=Math.max(uid,Number(d.state.nextId)||uid);
    normalizeAfterLoad();
  }catch(e){
    console.warn('StandRise backend unavailable:',e.message);if(tg&&tg.initData)setTimeout(()=>toast('Сервер не ответил: '+e.message),400);
    // Вне Telegram оставляем локальный демо-режим.
    try{const sv=localStorage.getItem('sr');if(sv){const o=JSON.parse(sv);['teams','players','matches','invites','events','praks'].forEach(k=>S[k]=o[k]||S[k])}}catch(_){}
    normalizeAfterLoad();
    if(!S.players.length){S.reg=true;S.pending={nick:'',demo:1}}
  }
  render();
}
S.players.forEach((p,i)=>{if(!p.gid)p.gid=String(51234000+i*137)});
S.players.forEach(p=>{if(p.org&&!p.plat)p.plat='ORGANIZER';delete p.org});if(!S.players.some(p=>p.plat=='OWNER')&&S.players[0])S.players[0].plat='OWNER';
S.events.forEach(e=>{if(!e.stages)e.stages={group:'',playoff:'Bo3',final:'Bo5'};if(e.stages.group&&!e.stages.s1)e.stages.s1='groups';if(!e.groups)e.groups=[];e.fmt=fmtStr(e.stages)});{const e=S.events.find(x=>x.id=='e1');if(e&&!e.bracket&&e.groups.length)genBracket(e,[...e.teams])}{const e=S.events.find(x=>x.id=='e5');if(e&&!e.swiss){e.swiss={teams:[...e.teams],list:[]};swissNext(e)}}
S.teams.forEach(t=>{if(!t.tag)t.tag=mkTag(t.name)});S.teams.forEach(t=>['OWNER','LEADER'].forEach(rl=>S.players.filter(p=>roleIn(p,t.id)==rl).slice(1).forEach(p=>setRoleIn(p,t.id,'PLAYER'))));
// Telegram auth: реальная проверка Telegram initData выполняется на сервере.
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
if(tu){S.real=true;S.admin=false;S.reg=false;S.pending=null}
function normalizeAfterLoad(){
  S.players.forEach(p=>{try{syncP(p)}catch(_){}});
  S.players.forEach((p,i)=>{if(!p.gid)p.gid=String(51234000+i*137)});
  S.players.forEach(p=>{if(p.org&&!p.plat)p.plat='ORGANIZER';delete p.org});
  if(!S.players.some(p=>p.plat=='OWNER')&&S.players[0])S.players[0].plat='OWNER';
}
const P=id=>S.players.find(p=>p.id==id),T=id=>S.teams.find(t=>t.id==id),me=()=>P(S.me);
const kd=p=>(p.k/Math.max(1,p.d)).toFixed(2),gm=p=>p.w+p.l,wr=p=>gm(p)?Math.round(p.w/gm(p)*100):0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo=(t,b)=>`<div class="ava ${b?'big':''}">${t&&t.logo&&t.logo.startsWith('data:')?`<img src="${t.logo}">`:esc(t?t.logo:'?')}</div>`;
const pav=(p,b)=>`<div class="ava ${b==2?'huge':b?'big':''}">${p.photo?`<img src="${p.photo}">`:esc(p.nick[0].toUpperCase())}</div>`;
const win=(m,i)=>{let a=0,b=0;m.maps.forEach(x=>x.a>x.b?a++:b++);return i==1?a:b};
function tstat(id){let w=0,l=0,mw=0,ml=0;allM().filter(m=>!techOf(m)).forEach(m=>{const i=m.t1==id?1:m.t2==id?2:0;if(!i)return;const a=win(m,1),b=win(m,2);(i==1?a>b:b>a)?w++:l++;m.maps.forEach(x=>{(i==1?x.a>x.b:x.b>x.a)?mw++:ml++})});return{w,l,mw,ml,n:w+l,wr:w+l?Math.round(w/(w+l)*100):0}}
// Игрок может состоять в нескольких командах: p.memberships=[{team,role}].
// p.team / p.role = "активная" команда (для управления, праков, регистрации на турниры).
const MAXT=10;
function mem(p){if(!Array.isArray(p.memberships))p.memberships=[];if(p.team&&!p.memberships.some(m=>m.team==p.team))p.memberships.unshift({team:p.team,role:p.role||'PLAYER'});return p.memberships}
function roleIn(p,tid){const m=mem(p).find(x=>x.team==tid);return m?m.role:null}
function syncP(p){const ms=mem(p).filter(m=>T(m.team));p.memberships=ms;const a=ms.find(m=>m.team==p.team)||ms[0]||null;p.team=a?a.team:null;p.role=a?a.role:null}
function joinTeam(p,tid,role,act){const ms=mem(p),m=ms.find(x=>x.team==tid);if(m)m.role=role;else ms.push({team:tid,role});if(act||!p.team)p.team=tid;syncP(p)}
function leaveTeam(p,tid){mem(p);p.memberships=p.memberships.filter(m=>m.team!=tid);if(p.team==tid)p.team=null;syncP(p)}
function setRoleIn(p,tid,r){const m=mem(p).find(x=>x.team==tid);if(m)m.role=r;if(p.team==tid)p.role=r}
const roster=id=>S.players.filter(p=>roleIn(p,id));
function mkTag(n){const c=x=>x.replace(/[^\p{L}\p{N}]/gu,'').toUpperCase();let b=c(n.split(/\s+/).map(w=>w[0]||'').join('')).slice(0,4);if(b.length<2)b=(c(n)+'XX').slice(0,3);let t=b,i=2;while(S.teams.some(x=>x.tag==t))t=b.slice(0,3)+i++;return t}
const tagOk=(g,id)=>/^[\p{L}\p{N}]{2,5}$/u.test(g)&&!S.teams.some(x=>x.id!=id&&String(x.tag).toLowerCase()==g.toLowerCase())&&!S.invites.some(i=>i.kind=='teamreq'&&i.status!='rejected'&&i.id!=id&&String(i.tag).toLowerCase()==g.toLowerCase());
const isOwner=()=>{const p=me();return !!(p&&p.plat=='OWNER')};
const treqs=()=>S.invites.filter(i=>i.kind=='teamreq');
const tPend=()=>treqs().filter(i=>i.status!='rejected');
const rTag=(p,tid)=>{tid=tid||p.team;const r=tid&&roleIn(p,tid);return r&&T(tid)?`<span class="tag ${r}">${r=='PLAYER'?'PLAYER':esc(T(tid).tag)+' · '+(r=='OWNER'?'CEO':'LEADER')}</span>${isRes(p,tid)?' <span class="tag reserve">ЗАПАС</span>':''}`:''};
const slotsCard=t=>{const o=roster(t.id).find(x=>roleIn(x,t.id)=='OWNER'),l=roster(t.id).find(x=>roleIn(x,t.id)=='LEADER'),row=(rl,x)=>`<div class="row" style="margin-top:6px"><span class="tag ${rl}">${esc(t.tag)} · ${rl=='OWNER'?'CEO':'LEADER'}</span><div class="sp t" style="font-size:14px">${x?esc(x.nick):'<span class="m">свободна</span>'}</div></div>`;return`<div class="card"><div class="m">РОЛИ КОМАНДЫ · по одному игроку на роль</div>${row('OWNER',o)}${row('LEADER',l)}</div>`};
Object.defineProperty(S,'admin',{get(){const p=me();return !!(p&&(p.plat=='ADMIN'||p.plat=='OWNER'))},set(){}});
const canOrg=()=>!!(me()&&me().plat);
const canEditEv=e=>!!(S.admin||(me()&&me().plat=='ORGANIZER'&&e.by==me().id));
const platTag=p=>p.plat?` <span class="tag org">${{ORGANIZER:'ОРГАНИЗАТОР',ADMIN:'АДМИН',OWNER:'ВЛАДЕЛЕЦ'}[p.plat]}</span>`:'';
const allM=()=>[...S.matches,...S.praks.filter(x=>x.status=='done')];
// VRS-очки команд: старт 1000, Elo-подобный расчёт по матчам в хронологическом порядке
function vrs(){const P0={};S.teams.forEach(t=>P0[t.id]={p:1000,d:0});allM().filter(m=>!techOf(m)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(m=>{const a=P0[m.t1],b=P0[m.t2];if(!a||!b)return;const w1=win(m,1),w2=win(m,2),e=1/(1+Math.pow(10,(b.p-a.p)/400)),sc=w1>w2?1:w1<w2?0:.5,mu=1+.25*Math.max(0,Math.abs(w1-w2)-1),d=Math.round(32*mu*(sc-e));a.p+=d;b.p-=d;a.d=d;b.d=-d});return P0}
const teamsSorted=()=>{const v=vrs();return[...S.teams].sort((a,b)=>v[b.id].p-v[a.id].p)};
const rank=id=>teamsSorted().findIndex(t=>t.id==id)+1;
const vcard=id=>{const v=vrs()[id]||{p:1000,d:0};return`<div class="card row" style="background:linear-gradient(90deg,#ff5a1f33,var(--bg2))"><div class="rk r${rank(id)}">#${rank(id)}</div><div class="sp"><div class="m">VRS ОЧКИ</div><div class="t" style="font-size:26px">${v.p}</div></div><div class="m ${v.d>0?'pos':v.d<0?'neg':''}">${v.d>0?'▲ +'+v.d:v.d<0?'▼ '+v.d:''}</div></div>`};
function vrsInfo(){sh.innerHTML=`<div class="sheet" onclick="if(event.target==this)sh.innerHTML=''"><div><div class="t" style="font-size:18px;margin-bottom:10px">Как считаются VRS-очки</div><div class="m" style="font-size:14px;line-height:1.6">• Каждая команда стартует с <b>1000</b> очков.<br>• Матчи считаются по дате, от старых к новым.<br>• Для матча считается шанс победы по разнице очков команд.<br>• Изменение = 32 × бонус × (результат − шанс). Победа над сильной командой даёт больше очков, над слабой — меньше.<br>• Бонус за счёт по картам: 2-1 → ×1, 2-0 → ×1.25, 3-0 → ×1.5.<br>• Что команда выиграла, столько соперник потерял.<br>• Праки тоже считаются: после игры команда нажимает «Завершить матч» и прикладывает скриншот.<br>• ▲/▼ — изменение за последний матч.</div><button class="btn g" onclick="sh.innerHTML=''">Понятно</button></div></div>`}
const canManage=()=>{const p=me();return p&&p.team&&(p.role=='OWNER'||p.role=='LEADER')};
const go=(p,id)=>{S.hist.push(S.route);S.route={p,id};if(p=='event')S.etab='over';S.q='';render();scrollTo(0,0)};
const tab=p=>{S.hist=[];S.route={p};S.q='';render();scrollTo(0,0)};
const back=()=>{S.route=S.hist.pop()||{p:'home'};render()};
const toast=m=>{if(tg&&tg.showAlert)try{tg.showAlert(m);return}catch(e){}alert(m)};

function genBracket(e,seeds){let size=2;while(size<seeds.length)size*=2;const q=[...seeds];while(q.length<size)q.push(null);const R=Math.log2(size),rounds=[];
for(let r=0;r<R;r++){const n=size/Math.pow(2,r);rounds.push({name:n==2?'Финал':n==4?'Полуфинал':'1/'+(n/2)+' финала',fmt:(n==2?e.stages.final:e.stages.playoff)||'Bo3',slots:Array.from({length:n/2},()=>({a:null,b:null}))})}
for(let i=0;i<size/2;i++){rounds[0].slots[i].a=q[i];rounds[0].slots[i].b=q[size-1-i]}

const BYE='~';
const dbBox=()=>({a:null,b:null});
function genBracketDb(e,seeds){
  let size=4;while(size<seeds.length)size*=2;
  const q=[...seeds];while(q.length<size)q.push(BYE);
  const R=Math.log2(size),L=2*(R-1),ub=[],lb=[];
  for(let r=0;r<R;r++){const n=size/Math.pow(2,r);ub.push({name:r==R-1?'Финал верхней сетки':r==R-2?'Полуфинал верхней':'Верхняя · раунд '+(r+1),fmt:e.stages.playoff||'Bo3',slots:Array.from({length:n/2},dbBox)})}
  for(let j=0;j<L;j++){const c=size/Math.pow(2,Math.floor(j/2)+2);lb.push({name:j==L-1?'Финал нижней сетки':'Нижняя · раунд '+(j+1),fmt:e.stages.playoff||'Bo3',slots:Array.from({length:c},dbBox)})}
  const seed=[];for(let i=0;i<size/2;i++)seed.push([q[i],q[size-1-i]]);
  e.bracket={type:'double',size,count:seeds.length,seed,rounds:ub,lower:lb,gf:{a:null,b:null,fmt:e.stages.final||'Bo5'},gf2:null,champ:null};
  e.places={};delete e.roster;delete e.champ;

g('fok').onclick=async()=>{const maps=parseMaps(g('fm').value);if(!maps.length)return toast(parseMaps.err||'Добавьте хотя бы одну карту');const fls=maps.map((_,i)=>{const e=g('fsh'+i);return e&&e.files[0]});if(fls.some(f=>!f))return toast('Приложите скриншот для каждой карты (всего карт: '+maps.length+')');
for(let i=0;i<maps.length;i++)maps[i].shot=await shrink(fls[i]);x.maps=maps;x.status='done';x.stats=[];const a1=win(x,1),a2=win(x,2);
[x.t1,x.t2].forEach((t,i)=>roster(t).forEach(p=>{const kv=g('k_'+p.id).value,dv=g('d_'+p.id).value;if(kv===''&&dv==='')return;const k=+kv||0,d=+dv||0,a=+g('a_'+p.id).value||0,n=gm(p),won=a1==a2?'x':((i==0?a1>a2:a2>a1)?'w':'l');p.adr=n?+(((+p.adr)*n+a)/(n+1)).toFixed(1):a;p.k+=k;p.d+=d;if(won=='w')p.w++;if(won=='l')p.l++;x.stats.push({pid:p.id,k,d,a,r:won})}));
sh.innerHTML='';save();render();toast('Матч засчитан: VRS и статистика обновлены')}}
function shotView(id){sh.innerHTML='';go('match',id)}
function prakAnnul(id){if(!(S.admin||me().admin)||!confirm('Аннулировать праку? Статистика и VRS будут пересчитаны.'))return;const x=pk(id);(x.stats||[]).forEach(z=>{const p=P(z.pid);if(!p)return;const n=gm(p);p.k-=z.k;p.d-=z.d;if(z.r!='x'){p.adr=n>1?+(((+p.adr)*n-z.a)/(n-1)).toFixed(1):0}if(z.r=='w')p.w--;if(z.r=='l')p.l--});x.status='annulled';save();render()}
function admmatch(id){const m=S.matches.find(x=>x.id==id);sheet('Матч',mf(m),v=>applyM(m,v))}
function del(k,id){if(!confirm('Удалить?'))return;if(k=='teams')rmTeam(id);else S[k]=S[k].filter(x=>x.id!=id);if(k=='players')S.invites=S.invites.filter(i=>i.to!=id);if(S.me==id&&!P(S.me))S.me=S.players[0]?S.players[0].id:null;save();render()}
// ===== Скриншоты матчей =====
const mergeMaps=(old,mp)=>{mp.forEach((x,i)=>{if(old&&old[i]&&old[i].map==x.map&&old[i].shot&&!x.shot)x.shot=old[i].shot});return mp};
const mgrOf=t=>{const p=me(),r=p&&roleIn(p,t);return r=='OWNER'||r=='LEADER'};
function canShot(m){if(S.admin)return true;const e=m.ev&&evById(m.ev);if(e)return canEditEv(e);return mgrOf(m.t1)||mgrOf(m.t2)}
function shotInputs(){const ta=document.getElementById('fm'),box=document.getElementById('shl');if(!ta||!box)return;const names=ta.value.split('\n').map(s=>s.trim().match(/^(.+?)\s+(\d+)\s*[-:]\s*(\d+)$/)).filter(Boolean).map(x=>mapName(x[1])||x[1]),key=names.join('|');if(box.dataset.k===key)return;box.dataset.k=key;box.innerHTML=names.map((n,i)=>`<label>📸 Скриншот карты ${i+1}: ${esc(n)} (обязательно)</label><input type="file" accept="image/*" id="fsh${i}">`).join('')||'<div class="m" style="margin-bottom:8px">Введите карты — для каждой появится поле скриншота.</div>'}
function shotPick(mid,i){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0],m=allM().find(x=>x.id==mid);if(!f||!m||!canShot(m)||!m.maps[i])return;m.maps[i].shot=await shrink(f);save();render()};inp.click()}
function shotDel(mid,i){const m=allM().find(x=>x.id==mid);if(!m||!canShot(m)||!confirm('Удалить скриншот?'))return;delete m.maps[i].shot;save();render()}
function shotZoom(mid,i){const m=allM().find(x=>x.id==mid),s=m&&(i<0?m.shot:m.maps[i]&&m.maps[i].shot);if(!s)return;sh.innerHTML=`<div class="sheet" onclick="sh.innerHTML=''"><div><img src="${s}" style="width:100%;border-radius:12px"><button class="btn g">Закрыть</button></div></div>`}
// ===== ТП / АП =====
// ТП — техническое поражение в ближайшем матче; АП — автопоражение во всех матчах (снятие с турнира).
// Соперник получает техническую победу и проходит дальше.
const techOf=m=>m.maps&&m.maps.length&&m.maps.every(x=>x.map=='ТП'||x.map=='АП')?m.maps[0].map:null;
const boN=f=>+String(f||'Bo1').slice(2)||1;
const techMaps=(f,kind,aWins)=>Array.from({length:boN(f)==2?2:Math.ceil(boN(f)/2)},()=>({map:kind,a:aWins?13:0,b:aWins?0:13}));
function techMatch(e,stage,round,t1,t2,w,kind,fmt){const m={id:nid(),ev:e.id,stage,round,t1,t2,date:new Date().toISOString().slice(0,10),maps:techMaps(fmt,kind,w==t1)};S.matches.unshift(m);return m}
function dqUse(e,t){const d=e.dq&&e.dq[t];if(d&&d.kind=='ТП')delete e.dq[t]}
function dqPick(e,a,b){if(e.dq[a])return[a,b];if(e.dq[b])return[b,a];return null}
function autoDq(e){
  if(!e.dq||!Object.keys(e.dq).length)return;
  let ch=true,n=0;
  while(ch&&n++<100){ch=false;
    [[e.qswiss,'qual'],[e.swiss,'swiss']].forEach(([sw,st])=>{
      if(!sw||!sw.list.length||(st=='qual'&&e.qdone))return;
      const rd=sw.list[sw.list.length-1],fmt=st=='qual'?e.stages.qfmt:e.stages.group,rn=(st=='qual'?'Квалификация · раунд ':'Раунд ')+sw.list.length;
      rd.pairs.forEach(pr=>{if(pr.bye||pr.mid)return;const x=dqPick(e,pr.a,pr.b);if(!x)return;const m=techMatch(e,st,rn,pr.a,pr.b,x[1],e.dq[x[0]].kind,fmt);pr.mid=m.id;dqUse(e,x[0]);ch=true})});
    const b=e.bracket;
    if(b&&b.type!='double'){
      const R=b.rounds.length;
      outer:for(let ri=0;ri<R;ri++){const rd=b.rounds[ri];for(let si=0;si<rd.slots.length;si++){const sl=rd.slots[si];if(sl.w||sl.bye||sl.mid||!sl.a||!sl.b)continue;const x=dqPick(e,sl.a,sl.b);if(!x)continue;
        const w=x[1],last=ri==R-1,m=techMatch(e,last?'final':'playoff',rd.name,sl.a,sl.b,w,e.dq[x[0]].kind,rd.fmt);sl.mid=m.id;sl.w=w;
        if(last)e.champ=w;else b.rounds[ri+1].slots[si>>1][si%2?'b':'a']=w;
        if(b.third&&ri==R-2)b.third[si%2?'b':'a']=x[0];
        dqUse(e,x[0]);computePlaces(e);ch=true;break outer}}
      const t=b.third;if(t&&!t.w&&!t.mid&&t.a&&t.b){const x=dqPick(e,t.a,t.b);if(x){const m=techMatch(e,'third','Матч за 3 место',t.a,t.b,x[1],e.dq[x[0]].kind,t.fmt);t.mid=m.id;t.w=x[1];dqUse(e,x[0]);computePlaces(e);ch=true}}
    }
    if(b&&b.type=='double'){
      const list=dbAll(b).concat([[b.gf,'g',0,0]],b.gf2?[[b.gf2,'g',1,0]]:[]);
      for(const [sl,k,r,i] of list){if(!sl.a||!sl.b||sl.a==BYE||sl.b==BYE||sl.bye||sl.w||sl.rw)continue;const x=dqPick(e,sl.a,sl.b);if(!x)continue;
        const m=techMatch(e,k=='u'?'playoff':k=='l'?'lower':'final',dbName(b,k,r),sl.a,sl.b,x[1],e.dq[x[0]].kind,dbFmt(b,k,r));sl.mid=m.id;sl.rw=x[1];dqUse(e,x[0]);dbSync(e);ch=true;break}
    }
  }
}
function evDq(id,t){const e=evById(id);if(!canEditEv(e)||!T(t))return;e.dq=e.dq||{};const cur=e.dq[t];
  sheet('ТП / АП · '+T(t).name,[{k:'kind',l:'Решение (соперник получает тех. победу и проходит дальше)',t:'select',o:[['ТП','ТП — техническое поражение в ближайшем матче'],['АП','АП — автопоражение во всех матчах (снятие с турнира)'],['','Снять отметку']],v:cur?cur.kind:'ТП'}],v=>{if(v.kind)e.dq[t]={kind:v.kind};else delete e.dq[t]},'Применить')}
// ===== Профиль игрока =====
const pst=p=>S.praks.filter(x=>x.status=='done'&&x.stats).flatMap(x=>x.stats.filter(z=>z.pid==p.id).map(z=>({x,z}))).sort((a,b)=>a.x.date<b.x.date?-1:a.x.date>b.x.date?1:0);
const rate=(k,d,a)=>+(0.6*(k/Math.max(1,d))+0.4*(a/75)).toFixed(2);
function chartP(ents){if(ents.length<2)return'<div class="card m">Для графика нужно минимум 2 матча со статистикой.</div>';const W=520,H=170,pl=28,pb=18,n=ents.length;const ser=[['rating','#2fd67b',e=>rate(e.z.k,e.z.d,e.z.a)],['kd','#6b8cff',e=>e.z.k/Math.max(1,e.z.d)]];const vals=ser.flatMap(s=>ents.map(s[2]));const mx=Math.max(1.6,Math.ceil(Math.max(...vals)*5)/5);const X=i=>pl+i*(W-pl-6)/(n-1),Y=v=>H-pb-v/mx*(H-pb-8);let g='';[0,.4,.8,1.2,1.6,2,2.4].filter(v=>v<=mx).forEach(v=>{g+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#262b3d"/><text x="2" y="${Y(v)+4}" fill="#7d86a3" font-size="10">${v}</text>`});
return`<div class="card"><div class="m" style="margin-bottom:6px"><span style="color:#2fd67b">— rating</span> · <span style="color:#6b8cff">— K/D</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}${ser.map(s=>`<polyline fill="none" stroke="${s[1]}" stroke-width="2" points="${ents.map((e,i)=>X(i)+','+Y(s[2](e))).join(' ')}"/>`).join('')}<text x="${pl}" y="${H-3}" fill="#7d86a3" font-size="10">${ents[0].x.date}</text><text x="${W}" y="${H-3}" fill="#7d86a3" font-size="10" text-anchor="end">${ents[n-1].x.date}</text></svg></div>`}
function pickPhoto(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);me().photo=c.toDataURL('image/jpeg',.8);save();render()};im.src=fr.result};fr.readAsDataURL(f)};inp.click()}
// ===== Профиль команды =====
function rankHist(id){const P0={};S.teams.forEach(t=>P0[t.id]=1000);const out=[];allM().filter(m=>!techOf(m)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(m=>{const a=P0[m.t1],b=P0[m.t2];if(a==null||b==null)return;const w1=win(m,1),w2=win(m,2),e=1/(1+Math.pow(10,(b-a)/400)),sc=w1>w2?1:w1<w2?0:.5,mu=1+.25*Math.max(0,Math.abs(w1-w2)-1),d=Math.round(32*mu*(sc-e));P0[m.t1]+=d;P0[m.t2]-=d;if(m.t1==id||m.t2==id)out.push({date:m.date,p:P0[id],r:1+Object.keys(P0).filter(k=>P0[k]>P0[id]).length})});return out}
function chartR(h){if(h.length<2)return'<div class="card m">График появится после 2 сыгранных матчей.</div>';const W=520,H=190,pl=26,pb=18,n=h.length,mx=Math.max(3,...h.map(x=>x.r)),X=i=>pl+i*(W-pl-8)/(n-1),Y=r=>10+(r-1)/(mx-1)*(H-pb-18);let g='';for(let r=1;r<=mx;r++)g+=`<line x1="${pl}" x2="${W}" y1="${Y(r)}" y2="${Y(r)}" stroke="#262b3d"/><text x="4" y="${Y(r)+4}" fill="#7d86a3" font-size="10">${r}</text>`;let pts='';h.forEach((x,i)=>{if(i)pts+=`${X(i)},${Y(h[i-1].r)} `;pts+=`${X(i)},${Y(x.r)} `});return`<div class="card"><svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}<polyline fill="none" stroke="#b78bff" stroke-width="2" points="${pts}"/><text x="${pl}" y="${H-3}" fill="#7d86a3" font-size="10">${h[0].date}</text><text x="${W}" y="${H-3}" fill="#7d86a3" font-size="10" text-anchor="end">${h[n-1].date}</text></svg></div>`}
// ===== Правило: PLAYER только в одной команде, LEADER/CEO — в любом числе =====
function otherPlayerTeam(p,except){const m=mem(p).find(x=>x.role=='PLAYER'&&x.team!=except&&T(x.team));return m?m.team:null}
// ===== Запасные игроки =====
function isRes(p,tid){const m=mem(p).find(x=>x.team==tid);return !!(m&&m.res)}
function resToggle(id,tid){tid=tid||me().team;const p=P(id);if(!tid||!mgrOf(tid)||!p||!roleIn(p,tid))return;const m=mem(p).find(x=>x.team==tid);
  if(m.res){const mains=roster(tid).filter(x=>x.id!=id&&!isRes(x,tid));
    if(mains.length>=5){sheet('Основа заполнена (5/5)',[{k:'o',l:'Кого перевести в запас вместо '+p.nick+'?',t:'select',o:mains.map(x=>[x.id,x.nick]),v:mains[0].id}],v=>{const o=P(v.o);if(!o)return false;mem(o).find(x=>x.team==tid).res=true;delete m.res},'Поменять местами');return}
    delete m.res}else m.res=true;
  save();render()}

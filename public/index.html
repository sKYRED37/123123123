const API_BASE='/api';
let apiReady=false;
async function apiJson(url,options={}){const r=await fetch(API_BASE+url,{headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg&&tg.initData?tg.initData:''},...options});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Ошибка сервера');return d}
const save=()=>{if(!apiReady)return;const payload={teams:S.teams,players:S.players,matches:S.matches,invites:S.invites,events:S.events,praks:S.praks};apiJson('/state',{method:'PUT',body:JSON.stringify(payload)}).catch(e=>console.warn('StandRise sync:',e.message));};
async function bootstrapOnline(){
  try{
    const d=await apiJson('/bootstrap');
    apiReady=true;
    ['teams','players','matches','invites','events','praks'].forEach(k=>{if(Array.isArray(d.state?.[k]))S[k]=d.state[k]});
    if(d.user){
      const p=S.players.find(x=>String(x.tg)===String(d.user.telegramId)||String(x.id)===String(d.user.playerId));
      if(p)S.me=p.id;
      S.real=true;S.admin=false;S.reg=!p;
      if(!p)S.pending={tg:String(d.user.telegramId),nick:d.user.username||d.user.firstName||''};
    }
    if(d.state?.nextId)uid=Math.max(uid,Number(d.state.nextId)||uid);
    normalizeAfterLoad();
  }catch(e){
    console.warn('StandRise backend unavailable:',e.message);
    // Вне Telegram оставляем локальный демо-режим.
    try{const sv=localStorage.getItem('sr');if(sv){const o=JSON.parse(sv);['teams','players','matches','invites','events','praks'].forEach(k=>S[k]=o[k]||S[k])}}catch(_){}
    normalizeAfterLoad();
  }
  render();
}

S.events.forEach(e=>{if(!e.stages)e.stages={group:'',playoff:'Bo3',final:'Bo5'};if(e.stages.group&&!e.stages.s1)e.stages.s1='groups';if(!e.groups)e.groups=[];e.fmt=fmtStr(e.stages)});{const e=S.events.find(x=>x.id=='e1');if(e&&!e.bracket&&e.groups.length)genBracket(e,[...e.teams])}{const e=S.events.find(x=>x.id=='e5');if(e&&!e.swiss){e.swiss={teams:[...e.teams],list:[]};swissNext(e)}}

const P=id=>S.players.find(p=>p.id==id),T=id=>S.teams.find(t=>t.id==id),me=()=>P(S.me);

const win=(m,i)=>{let a=0,b=0;m.maps.forEach(x=>x.a>x.b?a++:b++);return i==1?a:b};
function tstat(id){let w=0,l=0,mw=0,ml=0;allM().forEach(m=>{const i=m.t1==id?1:m.t2==id?2:0;if(!i)return;const a=win(m,1),b=win(m,2);(i==1?a>b:b>a)?w++:l++;m.maps.forEach(x=>{(i==1?x.a>x.b:x.b>x.a)?mw++:ml++})});return{w,l,mw,ml,n:w+l,wr:w+l?Math.round(w/(w+l)*100):0}}

function vrs(){const P0={};S.teams.forEach(t=>P0[t.id]={p:1000,d:0});allM().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(m=>{const a=P0[m.t1],b=P0[m.t2];if(!a||!b)return;const w1=win(m,1),w2=win(m,2),e=1/(1+Math.pow(10,(b.p-a.p)/400)),sc=w1>w2?1:w1<w2?0:.5,mu=1+.25*Math.max(0,Math.abs(w1-w2)-1),d=Math.round(32*mu*(sc-e));a.p+=d;b.p-=d;a.d=d;b.d=-d});return P0}

function vrsInfo(){sh.innerHTML=`<div class="sheet" onclick="if(event.target==this)sh.innerHTML=''"><div><div class="t" style="font-size:18px;margin-bottom:10px">Как считаются VRS-очки</div><div class="m" style="font-size:14px;line-height:1.6">• Каждая команда стартует с <b>1000</b> очков.<br>• Матчи считаются по дате, от старых к новым.<br>• Для матча считается шанс победы по разнице очков команд.<br>• Изменение = 32 × бонус × (результат − шанс). Победа над сильной командой даёт больше очков, над слабой — меньше.<br>• Бонус за счёт по картам: 2-1 → ×1, 2-0 → ×1.25, 3-0 → ×1.5.<br>• Что команда выиграла, столько соперник потерял.<br>• Праки тоже считаются: после игры команда нажимает «Завершить матч» и прикладывает скриншот.<br>• ▲/▼ — изменение за последний матч.</div><button class="btn g" onclick="sh.innerHTML=''">Понятно</button></div></div>`}

function createTeam(){sheet('Создать команду',[{k:'n',l:'Название'},{k:'tag',l:'Тэг команды (2–5 символов, уникальный)',ph:'Например, PHX'},{k:'l',l:'Логотип (эмодзи)',v:'🏆'},{k:'f',l:'или изображение',t:'file'}],v=>{const tag=v.tag.trim().toUpperCase();if(!v.n.trim())return false;if(!tagOk(tag,'')){toast('Тэг: 2–5 букв или цифр, он должен быть уникальным');return false}const t={id:nid(),tag,name:v.n.trim(),logo:v.f||v.l||'🏆',desc:''};S.teams.push(t);const p=me();p.team=t.id;p.role='OWNER';toast('Команда создана. Роли '+tag+' · CEO (вы) и '+tag+' · LEADER (свободна)')},'Создать')}

function decline(id){S.invites=S.invites.filter(x=>x.id!=id);save();render()}
function setRole(id,r){const p=P(id),t=T(p.team);if(r=='LEADER'){const cur=roster(p.team).find(x=>x.role=='LEADER'&&x.id!=id);if(cur){if(!confirm('Роль '+t.tag+' · LEADER уже у '+cur.nick+'. Передать её игроку '+p.nick+'?'))return;cur.role='PLAYER'}}p.role=r;save();render()}
function kick(id){if(!confirm('Исключить игрока?'))return;const p=P(id);p.team=null;p.role=null;save();render()}
function saveTeam(){const t=T(me().team);t.name=en.value.trim()||t.name;t.desc=ed.value;const f=ef.files[0];const fin=()=>{save();render();toast('Сохранено')};if(f){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,0,0,128,128);t.logo=c.toDataURL('image/jpeg',.8);fin()};im.src=fr.result};fr.readAsDataURL(f)}else{if(el.value)t.logo=el.value;fin()}}
function transfer(){const o=P(ow.value);if(!o||!confirm('Передать роль CEO игроку '+o.nick+'?'))return;const pl=roster(o.team).find(x=>x.role=='LEADER'&&x.id!=o.id);o.role='OWNER';me().role=pl?'PLAYER':'LEADER';S.tab='roster';save();render()}
function delTeam(){if(!confirm('Удалить команду навсегда?'))return;const id=me().team;rmTeam(id);S.hist=[];S.route={p:'me'};save();render()}
function rmTeam(id){S.players.forEach(p=>{if(p.team==id){p.team=null;p.role=null}});S.teams=S.teams.filter(t=>t.id!=id);S.invites=S.invites.filter(i=>i.team!=id);S.events.forEach(e=>dropTeam(e,id));S.praks=S.praks.filter(x=>x.t1!=id&&x.t2!=id)}
function leave(){if(!confirm('Покинуть команду?'))return;const p=me();p.team=null;p.role=null;S.hist=[];S.route={p:'me'};save();render()}
const tOpts=(v)=>[['','Без команды'],...S.teams.map(t=>[t.id,t.name])];
const pf=p=>[{k:'nick',l:'Ник',v:p.nick},{k:'gid',l:'Game ID (буквы и цифры)',v:p.gid||''},{k:'team',l:'Команда',t:'select',o:tOpts(),v:p.team||''},{k:'role',l:'Роль в команде',t:'select',o:[['PLAYER','PLAYER'],['LEADER','LEADER'],['OWNER','OWNER']],v:p.role||'PLAYER'},{k:'k',l:'Убийства',t:'number',v:p.k},{k:'d',l:'Смерти',t:'number',v:p.d},{k:'adr',l:'ADR',t:'number',v:p.adr},{k:'w',l:'Победы',t:'number',v:p.w},{k:'l',l:'Поражения',t:'number',v:p.l}];

function admt(id){const t=T(id);sheet('Команда',[{k:'n',l:'Название',v:t.name},{k:'tag',l:'Тэг команды (2–5 символов)',v:t.tag||''},{k:'l',l:'Логотип (эмодзи)',v:t.logo.startsWith('data:')?'':t.logo},{k:'f',l:'или изображение',t:'file'},{k:'d',l:'Описание',v:t.desc}],v=>{const tag=v.tag.trim().toUpperCase();if(!tagOk(tag,t.id)){toast('Тэг: 2–5 букв или цифр, уникальный');return false}t.tag=tag;t.name=v.n||t.name;if(v.f)t.logo=v.f;else if(v.l)t.logo=v.l;t.desc=v.d})}
function mf(m){const o=S.teams.map(t=>[t.id,t.name]);return[{k:'t1',l:'Команда 1',t:'select',o,v:m.t1},{k:'t2',l:'Команда 2',t:'select',o,v:m.t2},{k:'date',l:'Дата',t:'date',v:m.date},{k:'maps',l:'Карты (по строке: Название 13-9)',t:'area',v:m.maps.map(x=>`${x.map} ${x.a}-${x.b}`).join('\n'),ph:'Sandstone 13-9'}]}
function applyM(m,v){if(v.t1==v.t2){toast('Выберите разные команды');return false}const maps=v.maps.split('\n').map(s=>s.trim().match(/^(.+?)\s+(\d+)\s*[-:]\s*(\d+)$/)).filter(Boolean).map(x=>({map:x[1],a:+x[2],b:+x[3]}));if(!maps.length){toast('Добавьте хотя бы одну карту');return false}Object.assign(m,{t1:v.t1,t2:v.t2,date:v.date,maps})}
function admmatches(){if(S.teams.length<2)return toast('Нужно минимум 2 команды');const m={id:nid(),t1:S.teams[0].id,t2:S.teams[1].id,date:new Date().toISOString().slice(0,10),maps:[]};sheet('Новый матч',mf(m),v=>{if(applyM(m,v)===false)return false;S.matches.unshift(m)})}
function evFields(e){return[{k:'name',l:'Название',v:e.name},{k:'status',l:'Статус',t:'select',o:[['reg','Регистрация'],['live','Идёт сейчас'],['done','Завершён']],v:e.status},{k:'date',l:'Дата старта',t:'date',v:e.date},{k:'prize',l:'Призовой фонд',v:e.prize},{k:'max',l:'Макс. команд',t:'number',v:e.max},{k:'s1',l:'Первый этап',t:'select',o:[['','Без первого этапа (сразу плей-офф)'],['groups','Групповой этап'],['swiss','Швейцарская система']],v:(e.stages||{}).s1||''},{k:'gfmt',l:'Формат матчей первого этапа',t:'select',o:[['Bo1','Bo1'],['Bo2','Bo2'],['Bo3','Bo3'],['Bo5','Bo5']],v:(e.stages||{}).group||'Bo2'},{k:'srounds',l:'Раундов швейцарки',t:'select',o:[[3,'3'],[4,'4'],[5,'5'],[6,'6'],[7,'7']],v:(e.stages||{}).rounds||5},{k:'sadv',l:'Сколько команд из швейцарки выходит в плей-офф',t:'select',o:[[2,'2'],[4,'4'],[8,'8']],v:(e.stages||{}).adv||4},{k:'pfmt',l:'Формат плей-офф',t:'select',o:[['Bo1','Bo1'],['Bo2','Bo2'],['Bo3','Bo3'],['Bo5','Bo5']],v:(e.stages||{}).playoff||'Bo3'},{k:'ffmt',l:'Формат финала',t:'select',o:[['Bo1','Bo1'],['Bo2','Bo2'],['Bo3','Bo3'],['Bo5','Bo5']],v:(e.stages||{}).final||'Bo5'},{k:'tfmt',l:'Матч за 3 место',t:'select',o:[['','Без матча за 3 место'],['Bo1','Bo1'],['Bo2','Bo2'],['Bo3','Bo3'],['Bo5','Bo5']],v:(e.stages||{}).third||''},{k:'desc',l:'Описание',t:'area',v:e.desc}]}
const applyE=(e,v)=>{const st={s1:v.s1,group:v.s1?v.gfmt:'',rounds:+v.srounds||5,adv:+v.sadv||4,playoff:v.pfmt,final:v.ffmt,third:v.tfmt};Object.assign(e,{name:v.name.trim()||e.name,status:v.status,date:v.date,prize:v.prize,max:Math.max(2,+v.max||2),stages:st,fmt:fmtStr(st),desc:v.desc});if(!e.groups)e.groups=[];if(e.bracket){e.bracket.rounds.forEach((x,k,a)=>x.fmt=k==a.length-1?st.final:st.playoff);if(e.bracket.third&&st.third)e.bracket.third.fmt=st.third}};

function evCreate(){if(!canOrg())return;const e={id:nid(),by:me().id,name:'',status:'reg',date:new Date().toISOString().slice(0,10),prize:'',max:16,fmt:'',stages:{s1:'',group:'',rounds:5,adv:4,playoff:'Bo3',final:'Bo5',third:''},groups:[],desc:'',teams:[]};sheet('Новый турнир',evFields(e),v=>{if(!v.name.trim())return false;applyE(e,v);S.events.unshift(e)},'Создать турнир')}
function evEdit(id){const e=evById(id);if(!canEditEv(e))return;sheet('Изменить турнир',evFields(e),v=>applyE(e,v))}
function evStatus(id,st){const e=evById(id);if(!canEditEv(e))return;const bad=e.teams.filter(t=>roster(t).length<5);if(st=='live'&&bad.length){if(!confirm('В командах '+bad.map(t=>T(t).name).join(', ')+' меньше 5 игроков. Исключить их и запустить турнир?'))return;bad.forEach(t=>dropTeam(e,t))}e.status=st;save();render()}
function evKick(id,t){const e=evById(id);if(!canEditEv(e)||!confirm('Исключить команду из турнира?'))return;dropTeam(e,t);save();render()}
function evDelete(id){const e=evById(id);if(!canEditEv(e)||!confirm('Удалить турнир «'+e.name+'»?'))return;S.events=S.events.filter(x=>x.id!=id);S.matches.forEach(m=>{if(m.ev==id)delete m.ev});S.route=S.hist.pop()||{p:'events'};save();render()}
function fmtStr(s){return[s.s1=='swiss'?'Швейцарка '+s.group+' · '+(s.rounds||5)+' р.':s.s1=='groups'?'Группы '+s.group:'','Плей-офф '+s.playoff,'Финал '+s.final,s.third?'3 место '+s.third:''].filter(Boolean).join(' · ')}
function dropTeam(e,id){e.teams=e.teams.filter(x=>x!=id);if(e.swiss&&e.swiss.teams.includes(id)){S.matches=S.matches.filter(m=>!(m.ev==e.id&&m.stage=='swiss'));e.swiss=null}(e.groups||[]).forEach(g=>g.teams=g.teams.filter(x=>x!=id));S.matches=S.matches.filter(m=>!(m.ev==e.id&&m.stage=='group'&&(m.t1==id||m.t2==id)));if(e.bracket&&JSON.stringify(e.bracket).includes('"'+id+'"')){e.bracket=null;delete e.champ;e.places={};delete e.roster;S.matches=S.matches.filter(m=>!(m.ev==e.id&&['playoff','final','third'].includes(m.stage)))}}
function genBracket(e,seeds){let size=2;while(size<seeds.length)size*=2;const q=[...seeds];while(q.length<size)q.push(null);const R=Math.log2(size),rounds=[];
for(let r=0;r<R;r++){const n=size/Math.pow(2,r);rounds.push({name:n==2?'Финал':n==4?'Полуфинал':'1/'+(n/2)+' финала',fmt:(n==2?e.stages.final:e.stages.playoff)||'Bo3',slots:Array.from({length:n/2},()=>({a:null,b:null}))})}

sheet('Матч группового этапа ('+e.stages.group+')',[{k:'grp',l:'Группа',t:'select',o:e.groups.map(g=>[g.name,'Группа '+g.name]),v:g0.name},...f],v=>{const g=e.groups.find(x=>x.name==v.grp);if(!g.teams.includes(v.t1)||!g.teams.includes(v.t2)){toast('Обе команды должны быть из группы '+g.name);return false}m.grp=g.name;if(applyM(m,v)===false)return false;S.matches.unshift(m)},'Добавить матч')}
const rolesList=()=>{const v=me(),own=v.plat=='OWNER',q=(S.rq||'').trim().toLowerCase(),opts=own?[['','Обычный игрок'],['ORGANIZER','ORGANIZER'],['ADMIN','ADMIN'],['OWNER','OWNER']]:[['','Обычный игрок'],['ORGANIZER','ORGANIZER']],ord={OWNER:0,ADMIN:1,ORGANIZER:2,'':3};
return[...S.players].filter(p=>!q||p.nick.toLowerCase().includes(q)||String(p.gid).toLowerCase().includes(q)).sort((a,b)=>ord[a.plat||'']-ord[b.plat||'']).map(p=>{const lock=!own&&(p.plat=='ADMIN'||p.plat=='OWNER');return`<div class="card row">${pav(p)}<div class="sp"><div class="t">${esc(p.nick)}${platTag(p)}</div><div class="m">🆔 ${esc(p.gid)}</div></div><select style="width:130px;margin:0;padding:8px" ${lock?'disabled':''} onchange="setPlat('${p.id}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${o[0]==(p.plat||'')?'selected':''}>${o[1]}</option>`).join('')}${lock?`<option selected>${p.plat}</option>`:''}</select></div>`}).join('')||'<div class="m">Игрок не найден</div>'};
const rolesTab=()=>`<div class="card m" style="margin-bottom:10px">ORGANIZER — создаёт и ведёт свои турниры.<br>ADMIN — админ-панель, управляет всеми турнирами.<br>OWNER — владелец платформы: выдаёт любые роли, включая ADMIN и OWNER.${me().plat=='OWNER'?'':'<br>🔒 Вы можете выдавать только ORGANIZER.'}</div><input placeholder="🔎 Поиск игрока по нику или ID" value="${esc(S.rq)}" oninput="S.rq=this.value;document.getElementById('rl').innerHTML=rolesList()"><div id="rl">${rolesList()}</div>`;
function setPlat(id,v){const t=P(id),own=me().plat=='OWNER';if(!S.admin||(!own&&!((v==''||v=='ORGANIZER')&&(!t.plat||t.plat=='ORGANIZER')))){toast('Недостаточно прав');return render()}if(t.plat=='OWNER'&&v!='OWNER'&&S.players.filter(x=>x.plat=='OWNER').length<2){toast('Нельзя снять роль у последнего владельца платформы');return render()}t.plat=v;save();render()}
function evReg(id){const e=evById(id),p=me();if(!canManage()||e.teams.length>=e.max||e.teams.includes(p.team))return;if(roster(p.team).length<5)return toast('Для регистрации нужно минимум 5 игроков в команде (сейчас '+roster(p.team).length+')');e.teams.push(p.team);save();render();toast('Команда зарегистрирована')}
function evUnreg(id){const e=evById(id);dropTeam(e,me().team);save();render()}
function prakNew(to){const mt=me().team;if(!canManage())return;const o=S.teams.filter(t=>t.id!=mt).map(t=>[t.id,t.name]);if(!o.length)return toast('Нет других команд');
sheet('Вызов на праку',[{k:'to',l:'Соперник',t:'select',o,v:to||o[0][0]},{k:'date',l:'Дата',t:'date',v:new Date().toISOString().slice(0,10)},{k:'time',l:'Время',t:'time',v:'20:00'},{k:'fmt',l:'Формат',t:'select',o:[['Bo1','Bo1'],['Bo2','Bo2'],['Bo3','Bo3']],v:'Bo3'},{k:'note',l:'Комментарий (необязательно)',v:''}],v=>{if(!v.date)return false;S.praks.unshift({id:nid(),t1:mt,t2:v.to,date:v.date,time:v.time||'20:00',fmt:v.fmt,note:v.note,status:'pending',maps:[]});toast('Вызов отправлен команде «'+T(v.to).name+'»')},'Отправить вызов')}
const pk=id=>S.praks.find(x=>x.id==id);
function prakAns(id,ok){const x=pk(id);if(!canManage()||x.t2!=me().team)return;if(ok)x.status='accepted';else S.praks=S.praks.filter(y=>y.id!=id);save();render()}
function prakCancel(id){const x=pk(id);if(!canManage()||(x.t1!=me().team&&x.t2!=me().team)||!confirm('Отменить праку?'))return;S.praks=S.praks.filter(y=>y.id!=id);save();render()}
const shrink=file=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.src=fr.result};fr.readAsDataURL(file)});
function prakFinish(id){const x=pk(id);if(!canManage()||(x.t1!=me().team&&x.t2!=me().team))return;
const rows=t=>`<h2>${esc(T(t).name)}</h2>`+roster(t).map(p=>`<div class="row" style="margin-bottom:6px"><div class="sp t">${esc(p.nick)}</div>${['k','d','a'].map(c=>`<input class="mini" type="number" step="any" min="0" id="${c}_${p.id}" placeholder="${{k:'K',d:'D',a:'ADR'}[c]}">`).join('')}</div>`).join('');
sh.innerHTML=`<div class="sheet" onclick="if(event.target==this)sh.innerHTML=''"><div><div class="t" style="font-size:18px">🏁 Завершить матч</div><div class="m" style="margin:4px 0 10px">Загрузите скриншот итоговой таблицы и введите результат. Игроков с пустыми полями статистика не затрагивает.</div><label>Карты (по строке: Название 13-9)</label><textarea id="fm" rows="3" placeholder="Sandstone 13-9"></textarea><label>📸 Скриншот результата (обязательно)</label><input type="file" id="fsh" accept="image/*">${rows(x.t1)}${rows(x.t2)}<button class="btn" id="fok">Отправить и засчитать</button><button class="btn g" onclick="sh.innerHTML=''">Отмена</button></div></div>`;
const g=i=>document.getElementById(i);
g('fok').onclick=async()=>{const maps=parseMaps(g('fm').value),fl=g('fsh').files[0];if(!maps.length)return toast('Добавьте хотя бы одну карту');if(!fl)return toast('Приложите скриншот результата');
x.shot=await shrink(fl);x.maps=maps;x.status='done';x.stats=[];const a1=win(x,1),a2=win(x,2);
[x.t1,x.t2].forEach((t,i)=>roster(t).forEach(p=>{const kv=g('k_'+p.id).value,dv=g('d_'+p.id).value;if(kv===''&&dv==='')return;const k=+kv||0,d=+dv||0,a=+g('a_'+p.id).value||0,n=gm(p),won=a1==a2?'x':((i==0?a1>a2:a2>a1)?'w':'l');p.adr=n?+(((+p.adr)*n+a)/(n+1)).toFixed(1):a;p.k+=k;p.d+=d;if(won=='w')p.w++;if(won=='l')p.l++;x.stats.push({pid:p.id,k,d,a,r:won})}));
sh.innerHTML='';save();render();toast('Матч засчитан: VRS и статистика обновлены')}}
function shotView(id){const x=pk(id);if(!x.shot)return toast('Скриншот не приложен (демо-данные)');sh.innerHTML=`<div class="sheet" onclick="sh.innerHTML=''"><div><img src="${x.shot}" style="width:100%;border-radius:12px"><button class="btn g">Закрыть</button></div></div>`}
function prakAnnul(id){if(!(S.admin||me().admin)||!confirm('Аннулировать праку? Статистика и VRS будут пересчитаны.'))return;const x=pk(id);(x.stats||[]).forEach(z=>{const p=P(z.pid);if(!p)return;const n=gm(p);p.k-=z.k;p.d-=z.d;if(z.r!='x'){p.adr=n>1?+(((+p.adr)*n-z.a)/(n-1)).toFixed(1):0}if(z.r=='w')p.w--;if(z.r=='l')p.l--});x.status='annulled';save();render()}
function admmatch(id){const m=S.matches.find(x=>x.id==id);sheet('Матч',mf(m),v=>applyM(m,v))}
function del(k,id){if(!confirm('Удалить?'))return;if(k=='teams')rmTeam(id);else S[k]=S[k].filter(x=>x.id!=id);if(k=='players')S.invites=S.invites.filter(i=>i.to!=id);if(S.me==id&&!P(S.me))S.me=S.players[0].id;save();render()}
bootstrapOnline();
</script></body></html>

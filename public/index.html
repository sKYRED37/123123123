<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Topoff Ranked</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2c;--line:#262b3d;--tx:#e8ebf5;--mu:#7d86a3;--ac:#ff5a1f;--ac2:#18e0c8;--ok:#2fd67b;--bad:#ff4560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(var(--bg),#0a0c12ee);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:1px;font-size:18px}.logo b{color:var(--ac)}.logo i{font-style:normal;color:var(--ac2);font-size:11px;margin-left:6px;border:1px solid var(--ac2);padding:1px 5px;border-radius:4px}
.back{background:var(--bg3);border:0;color:var(--tx);border-radius:10px;width:34px;height:34px;font-size:18px}
main{padding:14px 16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu);margin:18px 0 10px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.t{font-weight:700}.m{color:var(--mu);font-size:12px}
.click{cursor:pointer}.click:active{background:var(--bg3)}
.ava{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#7a2cff);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;font-size:20px}
.ava img{width:100%;height:100%;object-fit:cover}.ava.big{width:64px;height:64px;font-size:30px;border-radius:18px}
.hero{background:radial-gradient(circle at 85% 0,#ff5a1f55,transparent 55%),radial-gradient(circle at 0 100%,#18e0c833,transparent 50%),var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero h1{font-size:24px;line-height:1.1}.hero h1 span{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid.g2{grid-template-columns:repeat(2,1fr)}
.st{background:var(--bg3);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:11px;color:var(--mu);text-transform:uppercase}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;outline:0;margin-bottom:8px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font:inherit;font-weight:700;width:100%;margin-top:6px}
.btn.s{width:auto;padding:7px 11px;font-size:13px;margin:0}.btn.g{background:var(--bg3);color:var(--tx)}.btn.d{background:#ff456022;color:var(--bad)}.btn.c{background:#18e0c822;color:var(--ac2)}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.5px}
.OWNER{background:#ffb02033;color:#ffb020}.LEADER{background:#18e0c822;color:var(--ac2)}.PLAYER{background:var(--bg3);color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:#0d1019f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:0;border:0;color:var(--mu);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px}nav button span{font-size:20px}nav button.on{color:var(--ac)}
.map{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.score{font-size:22px;font-weight:900;white-space:nowrap}
.rk{width:34px;text-align:center;font-weight:900;font-size:15px;color:var(--mu);flex:none}.rk.r1{color:#ffc400}.rk.r2{color:#c4cde0}.rk.r3{color:#d9803f}
.tag.live{background:#ff456033;color:var(--bad)}.tag.reg{background:#2fd67b22;color:var(--ok)}.tag.done{background:var(--bg3);color:var(--mu)}
.mini{width:50px!important;margin:0 0 0 4px!important;padding:8px 4px!important;text-align:center}
.tag.org{background:#a06bff33;color:#b78bff}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--mu);font-weight:600;text-align:center;padding:6px 2px;font-size:11px}.tb td{padding:8px 2px;text-align:center;border-top:1px solid var(--line)}.tb td:nth-child(2){text-align:left;font-weight:700}.tb tr.q td{background:#2fd67b12}
.br{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:stretch}.bcol{min-width:172px;display:flex;flex-direction:column}.bh{text-align:center;font-size:12px;font-weight:700;margin-bottom:8px}.bh span{display:block;color:var(--ac2);font-size:11px}.bc{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}.bm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}.bm.click{border-color:var(--ac)}.bt{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;font-size:13px;border-top:1px solid var(--line)}.bt:first-child{border:0}.bt.w{background:#2fd67b1f;font-weight:800}.bt.n{color:var(--mu)}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:85%;overflow:auto}
.demo{font-size:11px;color:var(--mu);background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:8px;margin-top:18px}.demo select{margin:6px 0 0;padding:8px}
label{font-size:12px;color:var(--mu);display:block;margin:2px 0 4px}
.tb.mt td:nth-child(2){text-align:center;font-weight:400}
.tag.reserve{background:#ffffff14;color:#c4cde0}
.ava.huge{width:84px;height:84px;font-size:38px;border-radius:20px}
.sc{border-radius:10px;padding:10px;text-align:center}.sc b{display:block;font-size:20px}.sc span{font-size:11px;opacity:.85;text-transform:uppercase}.cg{background:#1f7a45}.cy{background:#8a8530}.cr{background:#8b3340}.cn{background:var(--bg3)}
.shot{width:100%;border-radius:10px;margin-top:8px;display:block;cursor:zoom-in}
</style></head><body>
<header id="hd"></header><main id="app"></main><nav id="nav"></nav><div id="sh"></div>
<script src="/config.js"></script>
<script src="/app.js"></script></body></html>
